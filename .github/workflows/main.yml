
name: Build ELIOS NOTES APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          unzip -q ELIOS_NOTES_Continued_v4.zip -d unpacked
          test -f unpacked/ELIOS_NOTES/app/build.gradle.kts

      - name: Pin compatible Compose BOM
        working-directory: unpacked/ELIOS_NOTES
        run: |
          sed -i 's/2026\.09\.00/2025.12.00/g' app/build.gradle.kts
          echo "Compose BOM after adjustment:"
          grep -n "compose-bom" app/build.gradle.kts

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        working-directory: unpacked/ELIOS_NOTES
        run: gradle :app:testDebugUnitTest

      - name: Build APK
        working-directory: unpacked/ELIOS_NOTES
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ELIOS_NOTES-debug-apk
          path: unpacked/ELIOS_NOTES/app/build/outputs/apk/debug/*.apk
