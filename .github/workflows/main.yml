name: Build ELIOS NOTES APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check uploaded project archive
        run: |
          test -s ELIOS_NOTES_v45_fixed.zip
          unzip -t ELIOS_NOTES_v45_fixed.zip

      - name: Extract Android project
        run: |
          mkdir -p unpacked
          unzip -q ELIOS_NOTES_v45_fixed.zip -d unpacked
          test -f unpacked/ELIOS_NOTES/app/build.gradle.kts
          test -f unpacked/ELIOS_NOTES/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: unpacked/ELIOS_NOTES
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        working-directory: unpacked/ELIOS_NOTES
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Run unit tests
        working-directory: unpacked/ELIOS_NOTES
        continue-on-error: true
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ELIOS_NOTES-debug-apk
          path: unpacked/ELIOS_NOTES/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ELIOS_NOTES-build-reports
          path: |
            unpacked/ELIOS_NOTES/app/build/reports/
            unpacked/ELIOS_NOTES/app/schemas/
          if-no-files-found: ignore
          retention-days: 7
