name: Build ELIOS NOTES APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          unzip -q ELIOS_NOTES_Continued_v5.zip -d unpacked
          test -f unpacked/ELIOS_NOTES/app/build.gradle.kts

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        id: tests
        continue-on-error: true
        working-directory: unpacked/ELIOS_NOTES
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/test.log"

      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: unpacked/ELIOS_NOTES
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show exact errors in the run summary
        if: always()
        run: |
          {
            echo "## Result"
            echo "tests: ${{ steps.tests.outcome }} | build: ${{ steps.build.outcome }}"
            for f in test.log build.log; do
              [ -f "$f" ] || continue
              echo "### $f - errors"
              echo '```'
              grep -nE '^e: |What went wrong|Could not (find|resolve|get)|Execution failed|Unresolved reference|FAILED' -A4 "$f" | head -150
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            test.log
            build.log

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ELIOS_NOTES-debug-apk
          path: unpacked/ELIOS_NOTES/app/build/outputs/apk/debug/*.apk

      - name: Publish APK as a GitHub Release (download link)
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp unpacked/ELIOS_NOTES/app/build/outputs/apk/debug/*.apk ELIOS_NOTES-debug.apk
          gh release create "apk-run-${{ github.run_number }}" ELIOS_NOTES-debug.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "ELIOS NOTES debug APK (run ${{ github.run_number }})" \
            --notes "Debug build. Tests: ${{ steps.tests.outcome }}."

      - name: Fail the run if tests or build failed
        if: steps.build.outcome != 'success' || steps.tests.outcome != 'success'
        run: exit 1
